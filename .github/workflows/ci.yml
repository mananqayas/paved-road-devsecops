name: CI
on:
    push:

jobs:
    python:
        # Runner
        runs-on: ubuntu-24.04
        # Steps to be run in the runner
        steps:
          # Ubuntu latest VM clones code
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          # uv and uvx are installed using astral-sh/setup-uv Github action
        - name: Install uv and Python
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
          with:
            version: "0.12.21"
            python-version: "3.12"
        # Installing project dependencies defined in pyproject.toml
        - name: Install dependencies
          run: uv sync --locked --dev
        # Linting the code using ruff by astral
        - name: Lint
          run: uv run ruff check --fix .
        # Running the tests inside tests directory using pytest library
        - name: Run tests
          run: uv run pytest -q
    docker:
        needs: python
        runs-on: ubuntu-24.04
        steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Build docker image using Dockerfile present in the pwd
        - name: Build docker image
          run: docker build -t paved-road-sample-api:${{github.sha}} .
    terraform:
        runs-on: ubuntu-24.04
        steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Setup terraform using hashicorp's setup-terraform action
        - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        - name: Terraform format
          run: terraform -chdir=terraform fmt -check
        - name: Terraform init and validate
          run: terraform -chdir=terraform init -input=false && terraform -chdir=terraform validate
    secrets_scan:
        name: gitleaks
        runs-on: ubuntu-24.04
        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            fetch-depth: 0 # CRITICAL: Instructs Git to pull the entire history
        - name: Run Gitleaks Action
          uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    sast:
      name: semgrep
      runs-on: ubuntu-24.04
      container:
        image: semgrep/semgrep:latest
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Unit-test the custom Semgrep rules
        run: semgrep --test semgrep/rules
      - name: Scan application with strict CWE Top 25 policy
        run: >-
          semgrep scan
          --config semgrep/rules/cwe-top25-rules.yml
          --metrics=off
          --json
          --error
          app
          --text
    iac-scan:
      name: iac-scan
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        security-events: write
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v7
        with:
          directory: terraform
          framework: terraform
          quiet: true
          output_format: sarif
          output_file_path: reports
          soft_fail: true
      - name: Upload SARIF File
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: reports/results.sarif
    docker-file-scan:
      name: docker-file-scan
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        security-events: write
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        - name: Run Trivy vulnerability scanner in config mode
          uses: aquasecurity/trivy-action@v0.36.0 
          with:
            scan-type: 'config'
            scan-ref: './Dockerfile'
            severity: 'CRITICAL,HIGH'
            format: 'sarif'
            output: 'trivy-results-docker-file.sarif'
            exit-code: 1
        - name: Upload SARIF
          uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
          if: success() || failure()
          with:
            sarif_file: 'trivy-results-docker-file.sarif'

    docker-image-scan:
      name: docker-image-scan
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        security-events: write
      needs: docker
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        - name: Build docker image
          run: docker buildx build --load -t paved-road-sample-api:${{github.sha}} .
          # Generate the full SARIF report without breaking the build
        - name: Generate SARIF Security Report 
          uses: aquasecurity/trivy-action@v0.36.0 
          with:
            scan-type: 'image'
            image-ref: paved-road-sample-api:${{github.sha}}
            format: 'sarif'
            output: 'trivy-results-docker-image.sarif'
            exit-code: 0
        - name: Evaluate Security Gate 
          uses: aquasecurity/trivy-action@v0.36.0 
          with:
            scan-type: 'image'
            image-ref: paved-road-sample-api:${{github.sha}}
            format: 'table'
            severity: 'CRITICAL,HIGH'
            ignore-unfixed: true
            exit-code: 1
        - name: Upload SARIF
          uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
          if: always() # Ensures the report uploads even if the Gatekeeper step fails
          with:
            sarif_file: 'trivy-results-docker-image.sarif'
